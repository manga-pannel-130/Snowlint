[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowlint"
version = "0.1.0"
description = "Local evidence-driven AI/ML codebase auditor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "reportlab>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pypdf>=4.0",
]

[project.scripts]
snowlint = "snowlint.cli:main"

[tool.setuptools.packages.find]
include = ["snowlint*"]

[tool.setuptools]
py-modules = ["config", "scanner", "content_policy", "content_reader", "repository_map"]
